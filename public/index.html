<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WorkBuddy Monitor — 模型 Token 监控</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <h1>WorkBuddy Monitor</h1>
      <span class="subtitle">模型 Token 调用监控</span>
    </div>
    <div class="topbar-right">
      <span id="wb-home" class="wb-home" title="WorkBuddy 数据目录"></span>
      <button id="unit-toggle" class="unit-toggle" title="切换数字单位显示">k/M</button>
      <label class="refresh-toggle" title="自动刷新（每 5 秒）">
        <input type="checkbox" id="auto-refresh" checked>
        自动刷新
      </label>
      <span id="refresh-status" class="refresh-status">–</span>
    </div>
  </header>

  <div id="scan-error" class="scan-error hidden"></div>

  <main class="container">
    <!-- 全局汇总 -->
    <section id="summary-cards" class="summary-cards"></section>

    <!-- 模型分布 -->
    <section class="panel model-panel">
      <h2>模型分布（按 API 请求数）</h2>
      <div id="model-dist"></div>
    </section>

    <!-- 工具栏 -->
    <section class="toolbar">
      <input type="search" id="search" placeholder="搜索会话路径 / 标题 / 模型…" autocomplete="off">
      <div class="filters" id="filters">
        <button data-filter="all" class="active">全部</button>
        <button data-filter="active">活跃 (10min)</button>
        <button data-filter="24h">24 小时</button>
        <button data-filter="today">今日</button>
      </div>
      <select id="sort">
        <option value="activity">按最后活动</option>
        <option value="output">按累计输出</option>
        <option value="input">按累计输入</option>
        <option value="requests">按请求数</option>
        <option value="context">按上下文占用</option>
      </select>
    </section>

    <!-- 会话列表 -->
    <section id="session-list" class="session-list"></section>
    <div id="list-empty" class="empty hidden">没有匹配的会话</div>
  </main>

  <footer class="footer">
    WorkBuddy Web Monitor · 数据来自 <code>~/.workbuddy/projects/*.jsonl</code> ·
    速度为保守值：分母含工具执行时间，闲置超过 5 分钟的间隔不计入
  </footer>

  <script src="app.js"></script>
</body>
</html>
